<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Post Management2</title>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="header text-center">
                    <div>
                        <h1>Posts Management</h1>
                        <p>Manage and organize all posts in one place</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-2 offset-md-10">
                <button id="addPostBtn" class="btn btn-warning">+ Add Post</button>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">

                <table class="table">
                    <thead>
                        <tr>
                            <th>TITLE</th>
                            <th>AUTHOR</th>
                            <th>DATE(Created At)</th>
                            <th class="text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <!-- <tr>
                            <td>Getting Started with React</td>
                            <td>Sarah Wilson</td>
                            <td>Mar 12, 2024</td>
                            <td>
                                <div class="actions text-center">
                                    <button class="btn btn-warning">✎ Edit</button>
                                    <button class="btn btn-danger">🗑 Delete</button>
                                </div>
                            </td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row d-none mt-4" id="formRow">
            <div class="col-md-6 offset-md-3">
                    <div class="card">
                        <div class="card-header text-center" id="formHeading"><b>Add Post</b></div>
                        <div class="card-body">
                            <form id="postform">
                                <label for="title"><b>Title</b></label>
                                <input class="form-control mb-4" type="text" id="title"
                                    placeholder="Enter post title here" required>

                                <label for="author"><b>Author</b></label>
                                <input class="form-control mb-4" type="text" id="author" placeholder="post writer name">

                                <div class="d-flex justify-content-between">
                                    <div>
                                        <button id="addBtn" class="btn btn-primary">Add Post</button>
                                        <buttton type="button" id="updateBtn" class="btn btn-primary d-none">Update Post
                                        </buttton>
                                    </div>
                                    <buttton type="button" id="closeBtn" class="btn btn-danger">Close</buttton>
                                </div>
                            </form>
                        </div>
                    </div>
            </div>
        </div>
    </div>

    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
